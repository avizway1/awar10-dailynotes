Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id

  Keypair:
    Type: AWS::EC2::KeyPair::KeyName

  AvailabilityZone:
    Type: String
    Description: Choose your required AZ
    Default: ap-south-1a
    AllowedValues:
      - ap-south-1a

  InstanceType:
    Type: String
    Description: Choose your instance configuration
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - m7i-flex.large

Resources:
  MySG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: My first SG
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  MyFirstInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.18-x86_64}}"
      InstanceType: !Ref InstanceType
      KeyName: !Ref Keypair
      AvailabilityZone: !Ref AvailabilityZone
      SecurityGroupIds:
        - !Ref MySG
      Tags:
        - Key: Name
          Value: dynamic-Block-example

Outputs:
  MyEC2Id:
    Value: !Ref MyFirstInstance
    Description: My Instance id